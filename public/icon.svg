<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B1E1E"/>
      <stop offset="60%" stop-color="#731414"/>
      <stop offset="100%" stop-color="#4e0a0a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B1E1E"/>
      <stop offset="50%" stop-color="#a82828"/>
      <stop offset="100%" stop-color="#8B1E1E"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <filter id="iconShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#4e0a0a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- App Icon Base Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Outer Gold Border -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.6"/>
  <rect x="28" y="28" width="456" height="456" rx="88" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="8 6"/>

  <!-- The Splash Circle: Clean Luminous Circle with Warm Gold Rim -->
  <circle cx="256" cy="256" r="180" fill="#fdfbf7" stroke="url(#goldGrad)" stroke-width="6" filter="url(#shadow)"/>
  <circle cx="256" cy="256" r="172" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="6 4"/>

  <!-- Inside the Circle: JUST THE CALENDAR ICON -->
  <g filter="url(#iconShadow)">
    <!-- Calendar Body -->
    <rect x="156" y="172" width="200" height="184" rx="24" fill="#ffffff" stroke="#8B1E1E" stroke-width="5"/>
    
    <!-- Calendar Header Bar (Crimson) -->
    <path d="M 156 196 A 24 24 0 0 1 180 172 L 332 172 A 24 24 0 0 1 356 196 L 356 226 L 156 226 Z" fill="url(#headerGrad)"/>
    <line x1="156" y1="226" x2="356" y2="226" stroke="#e5e7eb" stroke-width="2"/>

    <!-- Binder Rings / Hanging Hooks (Metallic Gold) -->
    <rect x="196" y="152" width="18" height="38" rx="9" fill="url(#goldGrad)" stroke="#78350f" stroke-width="1.5"/>
    <rect x="201" y="157" width="8" height="18" rx="4" fill="#fef08a" opacity="0.8"/>
    
    <rect x="298" y="152" width="18" height="38" rx="9" fill="url(#goldGrad)" stroke="#78350f" stroke-width="1.5"/>
    <rect x="303" y="157" width="8" height="18" rx="4" fill="#fef08a" opacity="0.8"/>

    <!-- Calendar Grid Cells (Days of the Month) -->
    <!-- Row 1 -->
    <rect x="180" y="244" width="20" height="16" rx="4" fill="#e7e5e4"/>
    <rect x="214" y="244" width="20" height="16" rx="4" fill="#e7e5e4"/>
    <rect x="248" y="244" width="20" height="16" rx="4" fill="#e7e5e4"/>
    <rect x="282" y="244" width="20" height="16" rx="4" fill="#e7e5e4"/>
    <rect x="314" y="244" width="20" height="16" rx="4" fill="#e7e5e4"/>

    <!-- Row 2 (with highlight day) -->
    <rect x="180" y="274" width="20" height="16" rx="4" fill="#e7e5e4"/>
    <rect x="214" y="274" width="20" height="16" rx="4" fill="url(#goldGrad)"/>
    <rect x="248" y="274" width="20" height="16" rx="4" fill="#8B1E1E"/>
    <rect x="282" y="274" width="20" height="16" rx="4" fill="#e7e5e4"/>
    <rect x="314" y="274" width="20" height="16" rx="4" fill="#e7e5e4"/>

    <!-- Row 3 -->
    <rect x="180" y="304" width="20" height="16" rx="4" fill="#e7e5e4"/>
    <rect x="214" y="304" width="20" height="16" rx="4" fill="#e7e5e4"/>
    <rect x="248" y="304" width="20" height="16" rx="4" fill="#e7e5e4"/>
    <rect x="282" y="304" width="20" height="16" rx="4" fill="#e7e5e4"/>
    <rect x="314" y="304" width="20" height="16" rx="4" fill="#e7e5e4"/>
  </g>
</svg>
