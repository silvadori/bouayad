# Configuration de déploiement Netlify pour L'Éphéméride Bouayad (Vite React PWA)

[build]
  command = "npm run build"
  publish = "dist"

# Redirection SPA (Single Page Application)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# En-têtes HTTP pour la PWA et les Service Workers
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
    Access-Control-Allow-Origin = "*"
